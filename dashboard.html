<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บอร์ดสด - บ่อตกกุ้ง</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
    
    :root {
      --bg-dark: #0f111a; --card-bg: #1c1f2e; --card-border: #2a2d3d;
      --blue-main: #3b82f6; --red-main: #ef4444; --green-main: #10b981; --yellow-main: #f59e0b;
      --text-main: #ffffff; --text-muted: #94a3b8;
    }

    body {
      font-family: 'Kanit', sans-serif; background-color: var(--bg-dark); color: var(--text-main);
      margin: 0; padding: 30px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }

    .dashboard-container {
      width: 100%; max-width: 800px; background: var(--card-bg); border-radius: 20px;
      border: 1px solid var(--card-border); padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--card-border); }
    .window-controls { display: flex; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f56; } .dot.yellow { background: #ffbd2e; } .dot.green { background: #27c93f; }
    .title-area { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 500; }
    .live-badge { background: rgba(16, 185, 129, 0.2); color: var(--green-main); padding: 4px 12px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 8px; height: 8px; background: var(--green-main); border-radius: 50%; box-shadow: 0 0 10px var(--green-main); }
    .closed-badge { background: rgba(239, 68, 68, 0.2); color: var(--red-main); }
    .closed-badge .live-dot { background: var(--red-main); box-shadow: 0 0 10px var(--red-main); }

    .header-info { display: flex; justify-content: space-between; margin-bottom: 30px; }
    .round-id { font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; }
    .round-status { color: var(--text-muted); font-size: 1rem; }
    .timer-area { text-align: right; }
    .timer-label { color: var(--text-muted); font-size: 1rem; margin-bottom: 5px; }
    .timer-value { font-size: 2.5rem; font-weight: 700; color: var(--yellow-main); line-height: 1; font-family: monospace; }
    .timer-red { color: var(--red-main); }

    .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .card { background: #171925; border: 1px solid var(--card-border); border-radius: 16px; padding: 30px; position: relative; overflow: hidden; }
    .card.even { border-color: rgba(59, 130, 246, 0.3); } .card.odd { border-color: rgba(239, 68, 68, 0.3); }
    .card-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; }
    .card.even .card-title { color: var(--blue-main); } .card.odd .card-title { color: var(--red-main); }
    .card-amount { font-size: 3.5rem; font-weight: 700; margin-bottom: 15px; letter-spacing: -1px; }
    .card-stats { color: var(--text-muted); font-size: 1rem; margin-bottom: 15px; }
    .progress-bar { width: 100%; height: 6px; background: #2a2d3d; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    .card.even .progress-fill { background: var(--blue-main); box-shadow: 0 0 10px var(--blue-main); }
    .card.odd .progress-fill { background: var(--red-main); box-shadow: 0 0 10px var(--red-main); }

    .summary-card { background: #171925; border: 1px solid var(--card-border); border-radius: 16px; padding: 25px 30px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .summary-label { font-size: 1.2rem; color: var(--text-muted); }
    .summary-total { font-size: 2.2rem; font-weight: 700; color: var(--green-main); }

    .last-result-card { background: #171925; border: 1px solid var(--card-border); border-radius: 16px; padding: 25px 30px; display: flex; justify-content: space-between; align-items: center; }
    .last-result-left { display: flex; align-items: center; gap: 20px; }
    .scale-icon { font-size: 2.5rem; color: var(--text-muted); }
    .last-result-text { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 5px; }
    .last-result-weight { font-size: 2rem; font-weight: 700; }
    .winner-badge { background: rgba(59, 130, 246, 0.2); color: var(--blue-main); padding: 8px 24px; border-radius: 30px; font-size: 1.2rem; font-weight: 600; border: 1px solid rgba(59, 130, 246, 0.5); }
    .winner-badge.odd { background: rgba(239, 68, 68, 0.2); color: var(--red-main); border-color: rgba(239, 68, 68, 0.5); }
    .winner-badge.gray { background: transparent; color: var(--text-muted); border-color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <div class="top-bar">
      <div class="window-controls"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
      <div class="title-area">🦐 บอร์ดสด — บ่อตกกุ้ง</div>
      <div class="live-badge" id="mainLiveBadge"><div class="live-dot"></div> <span id="mainLiveText">LIVE</span></div>
    </div>

    <div class="header-info">
      <div>
        <div class="round-id" id="roundIdDisplay">รอบ -</div>
        <div class="round-status" id="statusDisplay">กำลังโหลดข้อมูล...</div>
      </div>
      <div class="timer-area">
        <div class="timer-label">เหลือเวลา</div>
        <div class="timer-value" id="timerDisplay">--:--</div>
      </div>
    </div>

    <div class="cards-grid">
      <div class="card even">
        <div class="card-title">คู่ · EVEN</div>
        <div class="card-amount" id="evenAmount">฿0</div>
        <div class="card-stats" id="evenCount">0 โต๊ะ/บิล</div>
        <div class="progress-bar"><div class="progress-fill" id="evenProgress" style="width: 0%;"></div></div>
      </div>
      <div class="card odd">
        <div class="card-title">คี่ · ODD</div>
        <div class="card-amount" id="oddAmount">฿0</div>
        <div class="card-stats" id="oddCount">0 โต๊ะ/บิล</div>
        <div class="progress-bar"><div class="progress-fill" id="oddProgress" style="width: 0%;"></div></div>
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-label">ยอดเดิมพันรวมในบ่อ</div>
      <div class="summary-total" id="totalAmount">฿0</div>
    </div>

    <div class="last-result-card">
      <div class="last-result-left">
        <i class="fa-solid fa-scale-balanced scale-icon"></i>
        <div>
          <div class="last-result-text">ผลชั่งกุ้งรอบล่าสุด</div>
          <div class="last-result-weight" id="lastWeight">รอข้อมูล...</div>
        </div>
      </div>
      <div class="winner-badge gray" id="lastWinner">-</div>
    </div>
  </div>

  <script>
    const _supabase = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);
    let targetEndTimeMs = null;
    let isRoundOpen = false;

    function formatMoney(amount) { return '฿' + amount.toLocaleString('th-TH'); }

    async function fetchLiveBoard() {
      try {
        const { data: rounds } = await _supabase.from('rounds').select('*').order('created_at', { ascending: false }).limit(2);
        if (rounds && rounds.length > 0) {
          const currentRound = rounds[0];
          document.getElementById('roundIdDisplay').innerText = `รอบ ${currentRound.round_id}`;
          targetEndTimeMs = currentRound.end_time_ms || 0;
          
          let now = new Date().getTime();
          let badge = document.getElementById('mainLiveBadge');
          
          if(currentRound.status === 'Open' && now < targetEndTimeMs) {
             document.getElementById('statusDisplay').innerText = `เปิดรับแทง`;
             document.getElementById('statusDisplay').style.color = "var(--green-main)";
             badge.className = "live-badge"; document.getElementById('mainLiveText').innerText = "LIVE";
             isRoundOpen = true;
          } 
          else if(currentRound.status === 'Open' && now >= targetEndTimeMs) {
             document.getElementById('statusDisplay').innerText = `รอแอดมินตัดผลชั่งกุ้ง`;
             document.getElementById('statusDisplay').style.color = "var(--red-main)";
             badge.className = "live-badge closed-badge"; document.getElementById('mainLiveText').innerText = "CLOSED";
             isRoundOpen = false;
          }
          else if(currentRound.status === 'Closed') {
             document.getElementById('statusDisplay').innerText = `ปิดรับแทง (รอผลชั่งกุ้ง)`;
             document.getElementById('statusDisplay').style.color = "var(--red-main)";
             badge.className = "live-badge closed-badge"; document.getElementById('mainLiveText').innerText = "CLOSED";
             isRoundOpen = false; targetEndTimeMs = 0; 
          }
          else if(currentRound.status === 'Ended') {
             document.getElementById('statusDisplay').innerText = `จบรอบแล้ว`;
             document.getElementById('statusDisplay').style.color = "var(--text-muted)";
             badge.className = "live-badge closed-badge"; document.getElementById('mainLiveText').innerText = "OFFLINE";
             isRoundOpen = false; targetEndTimeMs = 0;
          }

          // แสดงผลรอบก่อนหน้า
          if(currentRound.status === 'Ended') {
             document.getElementById('lastWeight').innerText = `${currentRound.weight} กรัม`;
             document.getElementById('lastWinner').className = `winner-badge ${currentRound.result === 'คู่' ? 'even' : 'odd'}`;
             document.getElementById('lastWinner').innerText = `${currentRound.result} ชนะ!`;
          } else if (rounds.length > 1 && rounds[1].status === 'Ended') {
             document.getElementById('lastWeight').innerText = `${rounds[1].weight} กรัม`;
             document.getElementById('lastWinner').className = `winner-badge ${rounds[1].result === 'คู่' ? 'even' : 'odd'}`;
             document.getElementById('lastWinner').innerText = `${rounds[1].result} ชนะ!`;
          } else {
             document.getElementById('lastWeight').innerText = `รอข้อมูล...`;
             document.getElementById('lastWinner').className = `winner-badge gray`;
             document.getElementById('lastWinner').innerText = `-`;
          }

          // ดึงยอดแทงสด
          const { data: bets } = await _supabase.from('bets').select('bet_type, amount, table_no').eq('round_id', currentRound.round_id).neq('status', 'Cancelled');
          let evenAmt = 0, oddAmt = 0, totalAmt = 0;
          let evenTables = new Set(), oddTables = new Set();
          
          if(bets) {
            bets.forEach(b => {
              totalAmt += Number(b.amount);
              if(b.bet_type === 'คู่') { evenAmt += Number(b.amount); evenTables.add(b.table_no || b.uid); }
              if(b.bet_type === 'คี่') { oddAmt += Number(b.amount); oddTables.add(b.table_no || b.uid); }
            });
          }

          document.getElementById('evenAmount').innerText = formatMoney(evenAmt);
          document.getElementById('oddAmount').innerText = formatMoney(oddAmt);
          document.getElementById('totalAmount').innerText = formatMoney(totalAmt);
          
          document.getElementById('evenCount').innerText = `${evenTables.size} โต๊ะ/บิล`;
          document.getElementById('oddCount').innerText = `${oddTables.size} โต๊ะ/บิล`;

          let evenPct = totalAmt > 0 ? (evenAmt / totalAmt) * 100 : 0;
          let oddPct = totalAmt > 0 ? (oddAmt / totalAmt) * 100 : 0;
          document.getElementById('evenProgress').style.width = `${evenPct}%`;
          document.getElementById('oddProgress').style.width = `${oddPct}%`;

        }
      } catch (error) {}
    }

    // นาฬิกานับถอยหลัง
    setInterval(() => {
      let display = document.getElementById('timerDisplay');
      if (!isRoundOpen || !targetEndTimeMs) {
        display.innerText = "00:00";
        display.classList.add('timer-red');
        return;
      }
      let now = new Date().getTime();
      let distance = targetEndTimeMs - now;
      if (distance <= 0) {
        display.innerText = "00:00";
        display.classList.add('timer-red');
        isRoundOpen = false;
        fetchLiveBoard(); 
      } else {
        let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        let seconds = Math.floor((distance % (1000 * 60)) / 1000);
        display.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        display.classList.remove('timer-red');
      }
    }, 1000);

    fetchLiveBoard();
    setInterval(fetchLiveBoard, 2000); // อัปเดตยอดทุก 2 วินาทีให้ไวขึ้นสำหรับจอ TV
  </script>
</body>
</html>
